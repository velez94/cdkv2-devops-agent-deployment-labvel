name: CDK Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  CDK_DEFAULT_REGION: us-east-1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  synth:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, qa]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CDK Synth (${{ matrix.environment }})
        run: npx cdk synth --context env=${{ matrix.environment }}

      - name: Upload CloudFormation template
        uses: actions/upload-artifact@v4
        with:
          name: cfn-template-${{ matrix.environment }}
          path: cdk.out/

  security-scan:
    needs: synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CDK Synth
        run: npx cdk synth --context env=dev

      - name: Run Checkov on synthesized templates
        uses: bridgecrewio/checkov-action@master
        with:
          directory: cdk.out/
          framework: cloudformation
          quiet: true
          soft_fail: true

  deploy-dev:
    needs: [synth, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.CDK_DEFAULT_REGION }}

      - name: CDK Deploy (dev)
        run: npx cdk deploy --all --context env=dev --require-approval never
