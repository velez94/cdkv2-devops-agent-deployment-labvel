repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --ext .ts
        language: system
        types: [typescript]
        pass_filenames: true
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        types: [typescript]
        pass_filenames: true
